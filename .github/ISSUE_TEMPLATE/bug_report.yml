name: Bug report
description: The compiler does something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The most useful thing you can include is a
        short program that shows the problem - a few lines that compile on
        their own are worth far more than a description of what happens inside
        a large project.

  - type: textarea
    id: what-happened
    attributes:
      label: What happens
      description: What the compiler does, and what you expected instead.
      placeholder: |
        The compiler accepts this and prints 10, but 1.0 is expected.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Program
      description: >
        The smallest program that shows the problem. This becomes a code block,
        so there is no need for backticks.
      render: text
      placeholder: |
        let total = 1.0;
        write_line("total {total}");
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Compiler version
      description: >
        The `ghul.compiler` version you are on. Run `dotnet ghul-compiler` with
        no arguments to print it, or read it out of `.config/dotnet-tools.json`.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where you saw it
      options:
        - Building a project (dotnet build)
        - Running a compiled program
        - The VS Code extension
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Compiler output
      description: >
        Any errors or warnings, in full. If you got an internal error, the whole
        message including the stack trace.
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >
        Whether it used to work on an earlier version, a workaround you found,
        anything you tried that changed the outcome.
    validations:
      required: false

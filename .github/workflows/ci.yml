# CI/CD pipeline. 

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

  # Daily, against the head of ghul-runtime rather than the release a user
  # would get, to catch it drifting from the compiler.
  schedule:
    - cron: '17 4 * * *'

  push:
    branches: [main]

# Serialize builds: pushes to a given ref run one at a time so concurrent
# builds can't race over version numbers or the published package. PR builds
# keep their own per-ref group and cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Most jobs run on a GitHub-hosted runner, which is free on a public
# repository and has no practical cap on how many run at once. The suites a
# bigger machine used to carry are divided into shards instead, so their wall
# time falls with the number of runners rather than with the size of any one
# of them.
#
# The analysis tests are the one job that does not respond to sharding: they
# are one MSTest assembly, so there is no shard to cut them into, and they set
# the end to end time on their own. The lever if that becomes painful is the
# harness's parallelism, not a larger runner - past 8 vCPU buys nothing,
# because the bottleneck is per-test compiler-subprocess IPC.
#
# Two events, two shapes that build, plus the release build. A pull request
# runs the whole suite - nothing is optional, nothing is skipped - on the
# request merged with `main` as it stood when the run started, and builds the
# release artefacts at the version the release will carry. Branch protection
# requires the branch to be up to date with `main` before merging, so the
# squash commit that lands is the tree the run tested, and the run's `Gate`
# is the required check. A push to `main` is the release build, and on the
# happy path it builds nothing: `version` finds the merged pull request's
# run, checks that run tested this very tree, carries its artefacts, and only
# the publish runs. The test jobs are gated on `version`'s `build` output,
# and `gate` is where the shapes are reconciled into one verdict - see
# `version` for the reasoning and the fallback.
#
# This is a default for well-meant contributions, not a control. A `pull_request`
# run uses the workflow file from the pull request itself, so a contributor can
# simply write a different `runs-on`. What actually limits what a fork's pull
# request can spend is the approval requirement under Settings -> Actions, and
# only its "all external contributors" setting keeps applying once someone has
# had a first contribution merged.
#
# A push inside someone else's fork needs no guard at all: it runs in their
# repository, billed to them.

env:
  CI: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  version:
    name: Create a version number
    runs-on: ubuntu-latest
    # Longer than the ten minutes the wait for a release build in flight
    # can take below, so that wait gives up with a warning rather than the
    # job being cancelled.
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}
      compiler: ${{ steps.compiler_version.outputs.compiler }}
      build: ${{ steps.compiler_version.outputs.build }}
      runtime: ${{ steps.libraries.outputs.runtime }}
      testing: ${{ steps.libraries.outputs.testing }}
      ghul_llvm: ${{ steps.libraries.outputs.ghul_llvm }}

    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    # The libraries every job in this run builds against, chosen once here
    # so that a release of either during the run can't give two jobs two
    # different versions: jobs whose outputs are compared, such as the
    # llvm lineage and the native compiler the .NET lineage builds, must have compiled the
    # same runtime and linked with the same ghul-llvm. The runtime is the
    # release a user of this compiler would get, chosen as ghul-cli chooses
    # it, so a run tests that pairing; a scheduled run takes the head
    # instead, pinned to its commit, to catch it drifting from the compiler.
    # ghul-llvm is its latest release, as a user's build fetches it.
    - name: Choose the libraries for the run
      id: libraries
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = schedule ]; then
          runtime=$(git ls-remote https://github.com/ghul-lang/ghul-runtime HEAD | cut -f1)
        else
          runtime=$(build/library-tag.sh ghul-runtime)
        fi
        ghul_llvm=$(gh release view --repo ghul-lang/ghul-llvm --json tagName --jq .tagName)
        # The unit tests run on ghul-testing's latest release.
        testing=$(build/library-tag.sh ghul-testing)
        [ -n "$runtime" ] && [ -n "$ghul_llvm" ] && [ -n "$testing" ]
        echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
        echo "ghul_llvm=$ghul_llvm" >> "$GITHUB_OUTPUT"
        echo "testing=$testing" >> "$GITHUB_OUTPUT"
        echo "runtime $runtime, ghul-llvm $ghul_llvm, ghul-testing $testing" >> "$GITHUB_STEP_SUMMARY"

    # Compute the next version: the patch bump of the latest vX.Y.Z tag, unless
    # the checked-in VERSION file declares a higher minor/major floor (a marker
    # in a commit or PR body can no longer trigger a bump). A pull request
    # into main builds the version the release will carry, so it has to be
    # the one the release build will compute: the patch bump of the latest
    # tag. A release build still in flight on main has not tagged yet, so
    # wait for it before choosing; a version chosen too early is caught at
    # the release build, which then rebuilds, but costs a full run. A pull
    # request into any other branch - a layer stacked on an open one - gets
    # a -beta.<run> prerelease instead, so it never collides with a real
    # release. The action only reads the repo - it never tags or releases.
    - name: Wait for any release build in flight
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for _ in $(seq 1 60); do
          active=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=5" \
                     --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          [ "${active}" = 0 ] && break
          echo "waiting for ${active} release build(s) on main to finish"
          sleep 10
        done
        [ "${active}" = 0 ] || echo "::warning::a release build on main is still running after ten minutes; if it tags the version chosen below, the release build will rebuild rather than publish this run's packages"
        # The checkout above took the tags as they were; a release that
        # finished during the wait tagged since.
        git fetch --tags origin

    - name: Determine the version
      id: version
      uses: ghul-lang/create-version@v1.0.0
      with:
        prerelease: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && format('beta.{0}', github.run_number) || '' }}

    # Resolve the ghul.compiler version that bootstraps this build, and
    # decide what this run owes: `build` says whether it bootstraps and runs
    # the whole suite at all. It is false only on a release build that carries
    # a pull request's artefacts, where nothing is built.
    #
    # On a pull request: the latest published version that is actually
    # downloadable from NuGet (skipping a release still propagating), and
    # the whole suite - nothing is optional. A pull request into main also
    # packs the release, so it records the tree it tested - the checkout is
    # the request merged with main - for the release build to check
    # against.
    #
    # On a push to main (the release build): the squash commit names the
    # pull request it came from, and that request's successful run is found
    # by its head. When that run tested this very tree and packed this
    # run's version, its packages are carried into this run as the release
    # artefacts and nothing is built or tested again: what was tested is
    # what ships. When main moved under the pull request after its run,
    # the version was taken by a release that tagged in between, or no run
    # is found - a direct push - nothing is known about this tree, and the
    # full suite runs and packs the release here.
    #
    # The bootstrap compiler version is published as the
    # `bootstrap-compiler-version` artifact; on a release run that is the
    # diagnostic record of what compiled the release, for as long as the
    # artifact is retained.
    - name: Determine bootstrap compiler version
      id: compiler_version
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        # nuget.org's answers are retried where it errors or times out, and
        # each is read whole before jq sees it, so an outage fails this step
        # rather than reading as an empty or unlisted version list.
        fetch() {
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 120 "$@"
        }

        # The status of a package download, retried on server errors and
        # timeouts but not on 404, which is the answer a version that can't
        # be downloaded gives.
        package_status() {
          curl -sI -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 120 "$1"
        }

        # The native compilers the merged pull request's run built and
        # tested: the llvm lineage's stage 2 for each platform.
        carry_llvm() {
          local triple
          for triple in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            gh run download "$1" -n "ghul-compiler-llvm-${triple}" -D "carried/llvm-${triple}" 2>/dev/null \
              && [ -f "carried/llvm-${triple}/ghul-compiler-llvm-${triple}.tar.gz" ] \
              || return 1
          done
        }

        resolve_latest() {
          local index versions v registration status
          index=$(fetch https://api.nuget.org/v3-flatcontainer/ghul.compiler/index.json)
          versions=$(jq -r '.versions | reverse | .[]' <<<"${index}")
          for v in ${versions}; do
            case "${v}" in *-*) continue ;; esac
            # Skip versions unlisted on nuget.org (e.g. a withdrawn or
            # mis-numbered release). Unlisted versions remain in the
            # flat-container index and stay downloadable, so without this check
            # the resolver would keep selecting the highest such version forever.
            registration=$(fetch --compressed "https://api.nuget.org/v3/registration5-gz-semver2/ghul.compiler/${v}.json")
            jq -e '.listed' >/dev/null <<<"${registration}" || continue
            status=$(package_status "https://api.nuget.org/v3-flatcontainer/ghul.compiler/${v}/ghul.compiler.${v}.nupkg")
            case "${status}" in
              200)
                printf '%s' "${v}"
                return 0
                ;;
              404) ;;
              *)
                echo "nuget.org answered ${status} for ghul.compiler ${v}" >&2
                return 1
                ;;
            esac
          done
          echo "no downloadable ghul.compiler version found" >&2
          return 1
        }

        compiler=""
        build=true
        case "${{ github.event_name }}" in
        pull_request)
          compiler=$(resolve_latest)
          ;;
        schedule)
          # The daily run against the libraries' heads: the whole suite,
          # published nowhere.
          compiler=$(resolve_latest)
          ;;
        push)
          # Release build: carry what the merged pull request's run built
          # and tested, when that run tested this very tree. The lookup can
          # briefly miss a just-merged request, so it retries for a minute
          # before falling back to building here.
          pr=""
          for _ in $(seq 1 6); do
            pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                   --jq 'first(.[] | select(.merged_at != null and .head.repo.fork == false) | .number) // empty' 2>/dev/null || true)
            [ -n "${pr}" ] && break
            sleep 10
          done
          head_sha=$([ -n "${pr}" ] && gh api "repos/${{ github.repository }}/pulls/${pr}" --jq .head.sha 2>/dev/null || true)
          run=$([ -n "${head_sha}" ] && gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${head_sha}&event=pull_request&status=success&per_page=5" \
                  --jq 'first(.workflow_runs[] | .id) // empty' 2>/dev/null || true)
          tree=$(git rev-parse "${{ github.sha }}^{tree}")
          if [ -n "${run}" ] \
             && gh run download "${run}" -n bootstrap-compiler-version -D carried 2>/dev/null \
             && [ "$(tr -d '[:space:]' < carried/tested-tree.txt 2>/dev/null)" = "${tree}" ] \
             && gh run download "${run}" -n ghul-compiler-package -D carried/nupkg 2>/dev/null \
             && gh run download "${run}" -n ghul-analysis-protocol-package -D carried/nupkg 2>/dev/null \
             && gh run download "${run}" -n ghul-compiler-aot -D carried/aot 2>/dev/null \
             && carry_llvm "${run}" \
             && gh run download "${run}" -n ghul-compiler-wasm -D carried/wasm 2>/dev/null \
             && [ -f "carried/nupkg/ghul.compiler.${{ steps.version.outputs.package }}.nupkg" ] \
             && [ -f "carried/nupkg/ghul.analysis.protocol.${{ steps.version.outputs.package }}.nupkg" ] \
             && [ -f "carried/aot/ghul-compiler-linux-x64.tar.gz" ] \
             && [ -f "carried/wasm/ghul-compiler-wasm.tar.gz" ]; then
            compiler=$(tr -d '[:space:]' < carried/bootstrap-compiler-version.txt)
            build=false
            echo "carrying the packages pull request #${pr} built and tested in run ${run}, whose tested tree is this commit's"
          else
            echo "::warning::no successful pull request run tested tree ${tree} and packed ${{ steps.version.outputs.package }} (pull request ${pr:-not found}, run ${run:-not found}); building and testing here"
            compiler=$(resolve_latest)
          fi
          ;;
        esac

        echo "compiler=${compiler}" >> "$GITHUB_OUTPUT"
        echo "build=${build}" >> "$GITHUB_OUTPUT"
        echo "Bootstrap compiler: ${compiler}"
        echo "Bootstrap compiler: \`${compiler}\`" >> "$GITHUB_STEP_SUMMARY"
        if [ "${build}" = false ]; then
          echo "Packages: carried from pull request #${pr}'s run ${run}; nothing built or tested here" >> "$GITHUB_STEP_SUMMARY"
        fi
        mkdir -p artifact
        printf '%s\n' "${compiler}" > artifact/bootstrap-compiler-version.txt
        # The tree this run tests - on a pull request the request merged
        # with main - for the release build to check against.
        git rev-parse 'HEAD^{tree}' > artifact/tested-tree.txt

    - name: Upload the carried compiler package
      if: steps.compiler_version.outputs.build == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-package
        path: carried/nupkg/ghul.compiler.${{ steps.version.outputs.package }}.nupkg

    - name: Upload the carried analysis protocol package
      if: steps.compiler_version.outputs.build == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: ghul-analysis-protocol-package
        path: carried/nupkg/ghul.analysis.protocol.${{ steps.version.outputs.package }}.nupkg

    # Carried like the packages: the release build does not run the AOT job,
    # so the archive the pull request's run built and smoke-tested is what
    # the release publishes.
    - name: Upload the carried AOT compiler archive
      if: steps.compiler_version.outputs.build == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-aot
        path: carried/aot/

    - name: Upload the carried x64 native compiler
      if: steps.compiler_version.outputs.build == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-llvm-x86_64-unknown-linux-musl
        path: carried/llvm-x86_64-unknown-linux-musl/

    - name: Upload the carried arm64 native compiler
      if: steps.compiler_version.outputs.build == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-llvm-aarch64-unknown-linux-musl
        path: carried/llvm-aarch64-unknown-linux-musl/

    - name: Upload the carried wasm-built compiler archive
      if: steps.compiler_version.outputs.build == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-wasm
        path: carried/wasm/

    - name: Upload bootstrap compiler version
      uses: actions/upload-artifact@v7
      with:
        name: bootstrap-compiler-version
        path: artifact/


  # Built by the compiler this commit produces, not by the one that
  # bootstrapped it. The unit tests are compiled ghul source like any
  # other consumer, so building them with the previous release hides
  # every change to what the compiler accepts: the suite passes against
  # rules the merged compiler no longer applies, and the next pull
  # request is the one that fails. Waiting on `bootstrap` costs this job
  # its head start, which is the same trade every other test job makes.
  unit_tests:
    name: Run unit tests
    needs: [version, bootstrap]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Set build number
      run: |
        echo "namespace Source is class BUILD is number: string static => \"${{ needs.version.outputs.tag }}\"; si si" >src/source/build.ghul

    # The unit tests, on the ghul-testing runner, on .NET. They run on llvm
    # too, in the llvm bootstrap job, with the compiler it builds.
    - name: Checkout ghul-testing
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-testing
        path: libraries/ghul-testing
        ref: ${{ needs.version.outputs.testing }}

    - name: Run unit tests
      run: dotnet run --project unit-tests -- --format text

    - name: Run WebAssembly library unit tests
      run: dotnet test wasm/tests/wasm-tests.ghulproj

    # The unit tests pin bytes; this asks an engine whether it accepts
    # them. Node is required, so a missing engine fails the step rather
    # than leaving it to check nothing.
    - name: Set up Node.js for WebAssembly validation
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Validate the WebAssembly module matrix in an engine
      run: wasm/tests/engine-check.sh
      env:
        WASM_ENGINES: node

    - name: Run LLVM library unit tests
      run: dotnet test llvm/tests/llvm-tests.ghulproj

    # The unit tests pin text; this asks LLVM whether it accepts it. The
    # tools are LLVM 23, the release ghul-llvm is built from, and the script fails
    # when it finds none. The packages are cached by runner and package
    # version, so a run needs nothing from apt.llvm.org once one has fetched
    # them.
    - name: Restore the LLVM tools' packages
      uses: actions/cache/restore@v6
      with:
        path: ~/llvm-tools-debs
        key: llvm-23-debs-${{ runner.os }}-${{ runner.arch }}-
        restore-keys: llvm-23-debs-${{ runner.os }}-${{ runner.arch }}-

    - name: Install the LLVM tools
      id: llvm-tools
      run: build/install-llvm-tools.sh ~/llvm-tools-debs

    - name: Keep the LLVM tools' packages
      if: steps.llvm-tools.outputs.downloaded == 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/llvm-tools-debs
        key: llvm-23-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.llvm-tools.outputs.version }}

    - name: Check the LLVM module matrix with LLVM's own tools
      run: llvm/tests/llvm-check.sh

  # The compiler compiles itself, the compiler that produces does the same,
  # and the two agree byte for byte. Everything downstream then consumes
  # the third pass, so what the tests run and what the feed receives is a
  # compiler emitted by the emitter in this commit, rather than by the last
  # published one.
  #
  # That distinction is not academic. A single-pass build is emitted by the
  # previous release, so a defect in the new back end that only shows when
  # the compiler itself carries it is invisible to every test: the whole
  # suite passed while the back end could not produce a working compiler,
  # because nothing under test had been through it.
  #
  # A failure here therefore stops the test jobs rather than merely
  # reporting alongside them. That is deliberate: a compiler that cannot
  # reproduce itself makes the suite's verdict meaningless.

  bootstrap:
    needs: [version]
    name: .NET lineage - build from the released .NET compiler
    if: needs.version.outputs.build == 'true'

    # Three sequential compiler passes, and the compiler does not
    # parallelise its source walk, so cores past the second buy nothing
    # and only single-core speed would: a paid ubicloud-standard-2 ran
    # this in 95s against 121s here, and that is the whole difference.
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Install the bootstrap compiler
      run: |
        for attempt in 1 2 3 4 5; do
          if dotnet tool update --local ghul.compiler --allow-downgrade --version ${{ needs.version.outputs.compiler }}; then
            exit 0
          fi
          echo "install attempt ${attempt} failed; retrying in 15s..."
          sleep 15
        done
        exit 1

    - name: Bootstrap
      env:
        CI: true
        PACKAGE_VERSION: ${{ needs.version.outputs.package }}
      run: ./build/bootstrap.sh

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-package
        path: ./nupkg/ghul.compiler.${{ needs.version.outputs.package }}.nupkg

    # Separate artefact for consumers that need to spawn the bootstrapped
    # compiler as a process (e.g. analysis_tests). The whole tool tree is
    # required, not just ghul.dll: the .NET host needs ghul.runtimeconfig.json
    # / ghul.deps.json beside the dll, and the compiler needs its sibling
    # assemblies (ghul-runtime, System.IO.Abstractions, ...).
    - name: Extract compiler tool tree
      run: |
        unzip -o nupkg/ghul.compiler.${{ needs.version.outputs.package }}.nupkg \
          'tools/net10.0/any/*' -d extracted-tool

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-tool
        path: ./extracted-tool/tools/net10.0/any

    # The analysis protocol client library ships as its own package so
    # out-of-repo tools can drive the compiler's analysis mode. Packed with
    # the same version as the compiler built from this commit.
    - name: Pack analysis protocol library
      run: dotnet pack analysis-protocol/analysis-protocol.ghulproj -nologo -p:CI=true -p:Version=${{ needs.version.outputs.package }}

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-analysis-protocol-package
        path: ./analysis-protocol/nupkg/ghul.analysis.protocol.${{ needs.version.outputs.package }}.nupkg


  # The integration tests that need .NET: those whose build_targets name
  # dotnet, and those tagged llvm-gap, which do not pass on llvm yet. Every
  # other test is built for llvm and wasm by llvm_test_shards instead. The
  # llvm-gap tag may only come off tests: the check below fails a pull
  # request that tags more of them than its base does.
  #
  # This job is not the required status check - `integration_tests` below
  # is, and its name is what branch protection lists.
  integration_shards:
    needs: [version, bootstrap]
    if: needs.version.outputs.build == 'true'
    name: Run .NET integration tests

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Check no more tests are tagged llvm-gap than on the base
      if: github.event_name == 'pull_request'
      run: |
        git fetch --quiet --depth=1 origin "${{ github.base_ref }}"
        build/llvm-gaps.sh check FETCH_HEAD

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    # The configuration names the runtime library's checkout for its wasm
    # builds, and ghul-test looks for it even though this run makes none.
    # The runtime the version job chose for the whole run.
    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: libraries/ghul-runtime
        ref: ${{ needs.version.outputs.runtime }}

    # The `ci` configurations in ghul-test.json: the compiler installed above
    # as the local tool and the runtime the bootstrapped compiler ships with.
    - name: Run integration tests
      run: |
        set -o pipefail
        dotnet ghul-test --config ci-dotnet-only integration-tests | tee test-results.txt
        dotnet ghul-test --config ci --tag llvm-gap integration-tests | tee -a test-results.txt

    - uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: test-results.txt


  # The required status check, under a name that stays the same whichever
  # jobs run the suite.
  #
  # `always()` is load-bearing. Without it a failed bootstrap skips the
  # shards, which skips this job, and a skipped job satisfies a required
  # check - so the pull request would show this green over a compiler that
  # never built. With it the job runs regardless and judges the result
  # itself.
  integration_tests:
    needs: [version, integration_shards]
    name: Run integration tests

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - name: Check the .NET integration tests passed
      env:
        RESULT: ${{ needs.integration_shards.result }}
        BUILD: ${{ needs.version.outputs.build }}
      run: |
        echo "shards: $RESULT"
        [ "$RESULT" = success ] || { [ "$RESULT" = skipped ] && [ "$BUILD" != true ]; }


  # Drives --analyse, which emits nothing. It still needs the emission
  # surface, because its fixtures build the analysis-protocol library
  # with the freshly built compiler - which is why it could not run
  # while that library came out empty.
  analysis_tests:
    needs: [version, bootstrap]
    if: needs.version.outputs.build == 'true'
    name: Run analysis tests

    runs-on: ubuntu-latest

    # The longest single job in the run, since one MSTest assembly cannot be
    # sharded: about three minutes on a GitHub-hosted runner.
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    # Build the test runner with the freshly-built compiler - the same one the
    # tests spawn as the compiler under test (the bootstrapped artefact's
    # ghul.dll, via ANALYSIS_TESTS_COMPILER_DLL). Building the harness with the
    # compiler it validates means a breaking language change that invalidates
    # the harness source fails here in its own PR, rather than landing latently
    # and breaking the next PR once the new compiler publishes.
    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Run analysis tests
      env:
        ANALYSIS_TESTS_COMPILER_DLL: ${{ github.workspace }}/bootstrap-tool/ghul.dll
      run: dotnet test analysis-tests -p:SkipCompilerProjectRef=true

  # The llvm lineage: the compiler built for llvm by the native compiler of
  # the release the .NET lineage bootstraps from, as `bootstrap` builds it
  # for .NET from that release's .NET compiler. Stage 0, the released native
  # compiler, builds this source (stage 1), and stage 1 builds it again
  # (stage 2). Stage 2 is the compiler the llvm and Rosetta Code tests run on
  # and the one a release ships. llvm_fixed_point checks that it rebuilds
  # itself, and llvm_cross_check that the .NET lineage builds the same
  # binary. Every release carries a native compiler for each platform, so a
  # stage 0 that cannot be fetched, or cannot build this source, fails the
  # run.
  llvm_lineage:
    needs: [version]
    if: needs.version.outputs.build == 'true'
    name: llvm lineage - build from the released native compiler (${{ matrix.triple }})

    runs-on: ${{ matrix.runner }}

    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            triple: aarch64-unknown-linux-musl

    steps:
    - uses: actions/checkout@v7

    # The runtime the version job chose for the whole run.
    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: libraries/ghul-runtime
        ref: ${{ needs.version.outputs.runtime }}

    - name: Fetch ghul-llvm
      run: |
        ghul_llvm="$(build/ghul-llvm.sh "$RUNNER_TEMP/ghul-llvm" "${{ needs.version.outputs.ghul_llvm }}")"
        test -x "$ghul_llvm"
        dirname "$ghul_llvm" >> "$GITHUB_PATH"

    # Stage 0: the native compiler released with the .NET compiler the
    # version job chose, checked against the sha256 published beside it.
    - name: Fetch the released native compiler
      id: stage0
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        release="v${{ needs.version.outputs.compiler }}"
        archive="ghul-compiler-llvm-${{ matrix.triple }}.tar.gz"
        mkdir -p "$RUNNER_TEMP/stage-0"
        cd "$RUNNER_TEMP/stage-0"
        if ! gh release download "$release" --repo "${{ github.repository }}" --pattern "$archive" --pattern "$archive.sha256"; then
          echo "::error::release $release carries no native compiler for ${{ matrix.triple }}"
          exit 1
        fi
        sha256sum --check --quiet "$archive.sha256"
        tar -xzf "$archive"
        echo "stage 0 for ${{ matrix.triple }}: the native compiler released in $release" >> "$GITHUB_STEP_SUMMARY"
        echo "compiler=$RUNNER_TEMP/stage-0/ghul-compiler/ghul-compiler" >> "$GITHUB_OUTPUT"

    - name: Build stages 1 and 2
      env:
        GHUL_NATIVE_VERSION: ${{ needs.version.outputs.package }}
      run: build/llvm-lineage.sh stage-2 "$RUNNER_TEMP/llvm-lineage" "${{ steps.stage0.outputs.compiler }}"

    # Packed as a release carries it: the executable as `ghul-compiler` in a
    # `ghul-compiler` directory, which ghul-cli installs. The release build
    # carries this archive from the pull request run that built it.
    - name: Pack stage 2
      shell: bash
      run: |
        set -euo pipefail
        compiler="$RUNNER_TEMP/llvm-lineage/stage-2/ghul"
        test "$("$compiler")" = "ghūl ${{ needs.version.outputs.package }} llvm"
        mkdir -p llvm-compiler/ghul-compiler
        cp "$compiler" llvm-compiler/ghul-compiler/ghul-compiler
        tar -C llvm-compiler -czf ghul-compiler-llvm-${{ matrix.triple }}.tar.gz ghul-compiler
        sha256sum ghul-compiler-llvm-${{ matrix.triple }}.tar.gz > ghul-compiler-llvm-${{ matrix.triple }}.tar.gz.sha256
        mkdir -p lineage
        cp "$RUNNER_TEMP/llvm-lineage/stage-2.sha256" "$RUNNER_TEMP/llvm-lineage/stage-1-vs-2" lineage/

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-llvm-${{ matrix.triple }}
        path: |
          ghul-compiler-llvm-${{ matrix.triple }}.tar.gz
          ghul-compiler-llvm-${{ matrix.triple }}.tar.gz.sha256

    # Stage 2's module and executable, hashed, and whether stage 1 was
    # identical to it, for llvm_fixed_point and llvm_cross_check.
    - uses: actions/upload-artifact@v7
      with:
        name: llvm-lineage-${{ matrix.triple }}
        path: lineage/

  # Stage 2 has to rebuild itself. Where stages 1 and 2 were identical it
  # does, as stage 1 built stage 2 and is the same compiler; otherwise stage
  # 2 builds stage 3, which must be identical to it. Beside the tests, which
  # start on stage 2 without waiting for this.
  llvm_fixed_point:
    needs: [version, llvm_lineage]
    if: needs.version.outputs.build == 'true'
    name: llvm lineage - check stage 2 rebuilds itself (${{ matrix.triple }})

    runs-on: ${{ matrix.runner }}

    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            triple: aarch64-unknown-linux-musl

    steps:
    - uses: actions/checkout@v7

    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: libraries/ghul-runtime
        ref: ${{ needs.version.outputs.runtime }}

    - name: Fetch ghul-llvm
      run: |
        ghul_llvm="$(build/ghul-llvm.sh "$RUNNER_TEMP/ghul-llvm" "${{ needs.version.outputs.ghul_llvm }}")"
        test -x "$ghul_llvm"
        dirname "$ghul_llvm" >> "$GITHUB_PATH"

    - name: Download stage 2
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-llvm-${{ matrix.triple }}

    - name: Download stage 2's hashes
      uses: actions/download-artifact@v8
      with:
        name: llvm-lineage-${{ matrix.triple }}
        path: lineage

    - name: Unpack stage 2
      run: |
        work="$RUNNER_TEMP/llvm-lineage"
        mkdir -p "$work/stage-2"
        tar -xzf ghul-compiler-llvm-${{ matrix.triple }}.tar.gz -O ghul-compiler/ghul-compiler > "$work/stage-2/ghul"
        chmod +x "$work/stage-2/ghul"
        cp lineage/* "$work/"

    - name: Build stage 3 where stages 1 and 2 differ
      env:
        GHUL_NATIVE_VERSION: ${{ needs.version.outputs.package }}
      run: build/llvm-lineage.sh fixed-point "$RUNNER_TEMP/llvm-lineage"

  # The compiler's unit tests on the ghul-testing runner, built for llvm by
  # stage 2, and the analysis tests in the bootstrap category with stage 2
  # as the analyser: the native compiler a release ships has to serve
  # analysis mode.
  llvm_lineage_tests:
    needs: [version, bootstrap, llvm_lineage]
    if: needs.version.outputs.build == 'true'
    name: llvm lineage - unit and analysis tests on stage 2

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: publish

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: libraries/ghul-runtime
        ref: ${{ needs.version.outputs.runtime }}

    - name: Checkout ghul-testing
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-testing
        path: libraries/ghul-testing
        ref: ${{ needs.version.outputs.testing }}

    - name: Fetch ghul-llvm
      run: |
        ghul_llvm="$(build/ghul-llvm.sh "$RUNNER_TEMP/ghul-llvm" "${{ needs.version.outputs.ghul_llvm }}")"
        test -x "$ghul_llvm"
        dirname "$ghul_llvm" >> "$GITHUB_PATH"

    - name: Download stage 2
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-llvm-x86_64-unknown-linux-musl

    - name: Unpack stage 2
      run: |
        mkdir -p "$RUNNER_TEMP/stage-2"
        tar -xzf ghul-compiler-llvm-x86_64-unknown-linux-musl.tar.gz -O ghul-compiler/ghul-compiler > "$RUNNER_TEMP/stage-2/ghul"
        chmod +x "$RUNNER_TEMP/stage-2/ghul"
        build/llvm-self-sources.sh "$RUNNER_TEMP/stage-2" libraries/ghul-runtime

    - name: Run the unit tests on llvm
      run: build/llvm-unit-tests.sh "$RUNNER_TEMP/stage-2" libraries/ghul-testing "$RUNNER_TEMP/stage-2/ghul"

    - name: Run the analysis tests against stage 2
      env:
        ANALYSIS_TESTS_ON_DIR: ${{ runner.temp }}/stage-2
      run: build/analysis-tests-on.sh llvm publish/ghul.dll libraries/ghul-runtime -- --filter TestCategory=bootstrap

  # The two lineages advance in lockstep: the .NET compiler this run
  # bootstrapped builds the native compiler from the same source, which has
  # to be byte for byte the llvm lineage's stage 2. A difference means one
  # lineage miscompiles.
  llvm_cross_check:
    needs: [version, bootstrap, llvm_lineage]
    if: needs.version.outputs.build == 'true'
    name: Cross-check - the native compiler .NET builds matches the llvm lineage (${{ matrix.triple }})

    runs-on: ${{ matrix.runner }}

    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            triple: aarch64-unknown-linux-musl

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: publish

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: libraries/ghul-runtime
        ref: ${{ needs.version.outputs.runtime }}

    - name: Fetch ghul-llvm
      run: |
        ghul_llvm="$(build/ghul-llvm.sh "$RUNNER_TEMP/ghul-llvm" "${{ needs.version.outputs.ghul_llvm }}")"
        test -x "$ghul_llvm"
        dirname "$ghul_llvm" >> "$GITHUB_PATH"

    - name: Build the native compiler with the .NET compiler
      env:
        LLVM_BOOTSTRAP_DIR: ${{ runner.temp }}/llvm-bootstrap
        LLVM_BOOTSTRAP_STEP: pass-1
        GHUL_NATIVE_VERSION: ${{ needs.version.outputs.package }}
      run: build/llvm-bootstrap.sh

    - name: Download stage 2's hashes
      uses: actions/download-artifact@v8
      with:
        name: llvm-lineage-${{ matrix.triple }}
        path: lineage

    - name: Compare with stage 2
      shell: bash
      run: |
        set -euo pipefail
        (cd "$RUNNER_TEMP/llvm-bootstrap/pass-1" && sha256sum ghul.ll ghul) > dotnet-built.sha256
        paste lineage/stage-2.sha256 dotnet-built.sha256
        if ! diff <(awk '{print $1}' lineage/stage-2.sha256) <(awk '{print $1}' dotnet-built.sha256) >/dev/null; then
          echo "::error::the .NET lineage and the llvm lineage give different native compilers for ${{ matrix.triple }}: one of them miscompiles"
          exit 1
        fi
        echo "the .NET lineage and the llvm lineage give one native compiler for ${{ matrix.triple }}"

    # ghul-project.json describes the compiler's source for an editor
    # analysing it with a compiler not hosted on .NET; the pinned ghul.cli
    # must load it, and it must list what the native build compiles.
    - name: Check ghul-project.json
      if: matrix.triple == 'x86_64-unknown-linux-musl'
      run: build/manifest-check.sh

  # The compiler builds a wasm compiler, which run by Node builds itself;
  # the two passes must write the same module and loader.
  wasm_bootstrap:
    needs: [version, bootstrap]
    if: needs.version.outputs.build == 'true'
    name: Bootstrap the compiler on wasm

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: publish

    - name: Restore local .NET tools
      run: dotnet tool restore

    # The runtime the version job chose for the whole run.
    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: libraries/ghul-runtime
        ref: ${{ needs.version.outputs.runtime }}

    - name: Build the compiler for wasm twice and compare
      env:
        WASM_BOOTSTRAP_DIR: ${{ runner.temp }}/wasm-bootstrap
        GHUL_NATIVE_VERSION: ${{ needs.version.outputs.package }}
      run: build/wasm-bootstrap.sh

    # The archive ghul-cli fetches for a machine with no usable Native AOT
    # compiler: pass 2's module and loader, since those are the ones the
    # bootstrap just proved reproduce themselves and compiled the compiler's
    # own source under Node, rather than pass 1's dotnet-built output.
    - name: Pack the wasm-built compiler
      shell: bash
      run: |
        set -euo pipefail
        work="${{ runner.temp }}/wasm-bootstrap"
        loader="$work/pass-2/ghul.mjs"
        test "$(node "$loader")" = "ghūl ${{ needs.version.outputs.package }} wasm"
        mkdir -p wasm-compiler
        cp "$work/pass-2/ghul.wasm" "$loader" wasm-compiler/
        tar -C wasm-compiler -czf ghul-compiler-wasm.tar.gz ghul.wasm ghul.mjs
        sha256sum ghul-compiler-wasm.tar.gz > ghul-compiler-wasm.tar.gz.sha256

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-wasm
        path: |
          ghul-compiler-wasm.tar.gz
          ghul-compiler-wasm.tar.gz.sha256

  # The wasm integration tests compare what the compiler said and the text
  # form it wrote, but no engine reads the modules. This builds each one
  # again with the bootstrapped compiler and has Node validate it.
  wasm_validation:
    needs: [version, llvm_lineage]
    if: needs.version.outputs.build == 'true'
    name: Validate wasm modules

    runs-on: ubuntu-latest

    container: buildpack-deps:noble-scm

    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Check the image has no .NET and cannot build C
      run: |
        for tool in dotnet cc gcc clang ld ld.lld as opt llc; do
          if command -v "$tool"; then
            echo "::error::$tool is installed"
            exit 1
          fi
        done

        if [ -e /usr/include/stdio.h ]; then
          echo "::error::the C library's headers are installed"
          exit 1
        fi

    # The configuration names the runtime library's checkout for its wasm
    # builds. The runtime the version job chose for the whole run.
    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: libraries/ghul-runtime
        ref: ${{ needs.version.outputs.runtime }}

    # The modules are built with the commands ghul-test lists for them, by
    # its Native AOT runner, so the job needs no .NET.
    - name: Fetch ghul-test
      run: |
        runner="$(build/fetch-ghul-test.sh)"
        echo "GHUL_TEST=$runner" >> "$GITHUB_ENV"

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    # The modules are built by the llvm lineage's stage 2.
    - name: Download the native compiler
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-llvm-x86_64-unknown-linux-musl

    - name: Install the native compiler
      run: |
        mkdir -p hosts/llvm
        tar -xzf ghul-compiler-llvm-x86_64-unknown-linux-musl.tar.gz -O ghul-compiler/ghul-compiler > hosts/llvm/ghul
        chmod +x hosts/llvm/ghul
        test "$(hosts/llvm/ghul)" = "ghūl ${{ needs.version.outputs.package }} llvm"

    - name: Validate the wasm test modules in Node
      run: build/wasm-validate.sh integration-tests "$PWD/hosts/llvm/ghul"

  # The integration suite, built and run as a user's build would build and
  # run it: the llvm lineage's stage 2 builds every test for llvm,
  # through fork servers, and hands each module to the ghul-llvm release
  # fetched from GitHub, in an image with no .NET and nothing to
  # compile, assemble or link C with, so a program that needs anything from
  # the machine fails here. Every test is built unoptimised, and every test
  # built for wasm runs too, under Node; the tests whose build_targets name
  # llvm are built optimised as well, since a test that passes at one level
  # and not the other is a backend bug or a missing check. A test whose
  # build_targets leave llvm out, or tagged llvm-gap, is integration_shards'.
  # The suite runs in five shards, striped by discovery order, so no shard
  # collects a whole directory of like-cost tests. llvm_tests below judges
  # the shards and the cell scenarios under one name that does not change
  # with the shard count.
  llvm_test_shards:
    needs: [version, llvm_lineage]
    if: needs.version.outputs.build == 'true'
    name: Run llvm integration tests (${{ matrix.shard }}/5)

    runs-on: ubuntu-latest

    container: buildpack-deps:noble-scm

    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
    - uses: actions/checkout@v7

    - name: Check the image has no .NET and cannot build C
      run: |
        for tool in dotnet cc gcc clang ld ld.lld as opt llc; do
          if command -v "$tool"; then
            echo "::error::$tool is installed"
            exit 1
          fi
        done

        if [ -e /usr/include/stdio.h ]; then
          echo "::error::the C library's headers are installed"
          exit 1
        fi

    - name: Fetch the ghul-test runner
      run: |
        runner="$(build/fetch-ghul-test.sh)"
        echo "GHUL_TEST=$runner" >> "$GITHUB_ENV"

    # The runtime the version job chose for the whole run.
    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: libraries/ghul-runtime
        ref: ${{ needs.version.outputs.runtime }}

    - name: Fetch ghul-llvm
      run: |
        ghul_llvm="$(build/ghul-llvm.sh "$RUNNER_TEMP/ghul-llvm" "${{ needs.version.outputs.ghul_llvm }}")"
        test -x "$ghul_llvm"
        dirname "$ghul_llvm" >> "$GITHUB_PATH"

    - name: Build the objects the llvm tests link
      run: build/llvm-test-objects.sh

    # The tests are built by the llvm lineage's stage 2, in hosts/llvm/
    # where the ci-native configurations look for it.
    - name: Download the native compiler
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-llvm-x86_64-unknown-linux-musl

    # Run with no arguments the compiler prints its version and exits, which
    # checks that the unpacked compiler is this run's build.
    - name: Install the native compiler
      run: |
        mkdir -p hosts/llvm
        tar -xzf ghul-compiler-llvm-x86_64-unknown-linux-musl.tar.gz -O ghul-compiler/ghul-compiler > hosts/llvm/ghul
        chmod +x hosts/llvm/ghul
        test "$(hosts/llvm/ghul)" = "ghūl ${{ needs.version.outputs.package }} llvm"

    # --build-server: one test built twice in one server, each build compared
    # with a cold compile. The fork servers the tests run through do not use it.
    - name: Compare build-server builds with cold builds
      if: matrix.shard == 1
      run: build/build-server-equivalence.sh "$PWD/hosts/llvm/ghul" "$PWD/libraries/ghul-runtime" 40 1

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Run the optimised llvm integration tests
      run: bash -c "set -o pipefail ; \"$GHUL_TEST\" --config ci-native --not-tag llvm-gap --shard ${{ matrix.shard }}/5 integration-tests | tee test-results-O2.txt"

    - name: Run the integration tests
      run: bash -c "set -o pipefail ; \"$GHUL_TEST\" --config ci-native-all --not-tag llvm-gap --shard ${{ matrix.shard }}/5 integration-tests | tee test-results.txt"

    - name: Validate the llvm test modules
      if: matrix.shard == 1
      run: build/llvm-validate.sh integration-tests "$PWD/hosts/llvm/ghul"

  # Cells compiled one after another, each against the ones before it, and
  # loaded into one process by the cell host from the same ghul-llvm release.
  # A job of its own, so neither it nor the llvm integration tests run close
  # to the fifteen-minute limit.
  llvm_cells:
    needs: [version, llvm_lineage]
    if: needs.version.outputs.build == 'true'
    name: Run the llvm cell scenarios

    runs-on: ubuntu-latest

    container: buildpack-deps:noble-scm

    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Check the image has no .NET and cannot build C
      run: |
        for tool in dotnet cc gcc clang ld ld.lld as opt llc; do
          if command -v "$tool"; then
            echo "::error::$tool is installed"
            exit 1
          fi
        done

        if [ -e /usr/include/stdio.h ]; then
          echo "::error::the C library's headers are installed"
          exit 1
        fi

    # The cells are built by the llvm lineage's stage 2.
    - name: Download the native compiler
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-llvm-x86_64-unknown-linux-musl

    - name: Install the native compiler
      run: |
        mkdir -p hosts/llvm
        tar -xzf ghul-compiler-llvm-x86_64-unknown-linux-musl.tar.gz -O ghul-compiler/ghul-compiler > hosts/llvm/ghul
        chmod +x hosts/llvm/ghul
        test "$(hosts/llvm/ghul)" = "ghūl ${{ needs.version.outputs.package }} llvm"

    # The runtime the version job chose for the whole run.
    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: libraries/ghul-runtime
        ref: ${{ needs.version.outputs.runtime }}

    - name: Fetch ghul-llvm
      run: |
        ghul_llvm="$(build/ghul-llvm.sh "$RUNNER_TEMP/ghul-llvm" "${{ needs.version.outputs.ghul_llvm }}")"
        test -x "$ghul_llvm"
        dirname "$ghul_llvm" >> "$GITHUB_PATH"

    - name: Run the cell scenarios
      run: |
        host="$(build/ghul-llvm-host.sh "$RUNNER_TEMP/ghul-llvm-host")"
        ghul_llvm="$(dirname "$(dirname "$(command -v ghul-llvm)")")"
        build/llvm-cells.sh hosts/llvm/ghul "$ghul_llvm" "$host"

  # The llvm tests' one name: every shard and the cell scenarios passed. As
  # for integration_tests, `always()` makes a failed build fail this job
  # rather than skip it.
  llvm_tests:
    needs: [version, llvm_test_shards, llvm_cells]
    name: Run llvm tests

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - name: Check every shard and the cell scenarios passed
      env:
        SHARDS: ${{ needs.llvm_test_shards.result }}
        CELLS: ${{ needs.llvm_cells.result }}
        BUILD: ${{ needs.version.outputs.build }}
      run: |
        echo "shards: $SHARDS, cells: $CELLS"
        for result in "$SHARDS" "$CELLS"; do
          [ "$result" = success ] || { [ "$result" = skipped ] && [ "$BUILD" != true ]; } || exit 1
        done

  # The llvm integration tests at -O0 on an arm64 runner, with ghul-llvm's
  # aarch64 release: what a native compiler for aarch64 would build. Not part
  # of the Gate, and run by the scheduled build only, so it holds no pull
  # request: a gap it finds is fixed or filed the next day.
  llvm_tests_arm64:
    needs: [version, llvm_lineage]
    if: needs.version.outputs.build == 'true' && github.event_name == 'schedule'
    name: Run llvm tests on arm64 (O0)

    runs-on: ubuntu-26.04-arm

    container: buildpack-deps:noble-scm

    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Check the image has no .NET and cannot build C
      run: |
        for tool in dotnet cc gcc clang ld ld.lld as opt llc; do
          if command -v "$tool"; then
            echo "::error::$tool is installed"
            exit 1
          fi
        done

        if [ -e /usr/include/stdio.h ]; then
          echo "::error::the C library's headers are installed"
          exit 1
        fi

    # The tests are built by the arm64 llvm lineage's stage 2, in hosts/llvm/
    # where the host-llvm configuration looks for it.
    - name: Download the native compiler
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-llvm-aarch64-unknown-linux-musl

    - name: Install the native compiler
      run: |
        mkdir -p hosts/llvm
        tar -xzf ghul-compiler-llvm-aarch64-unknown-linux-musl.tar.gz -O ghul-compiler/ghul-compiler > hosts/llvm/ghul
        chmod +x hosts/llvm/ghul
        test "$(hosts/llvm/ghul)" = "ghūl ${{ needs.version.outputs.package }} llvm"

    - name: Fetch the ghul-test runner
      run: |
        runner="$(build/fetch-ghul-test.sh)"
        echo "GHUL_TEST=$runner" >> "$GITHUB_ENV"

    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: libraries/ghul-runtime
        ref: ${{ needs.version.outputs.runtime }}

    - name: Fetch ghul-llvm
      run: |
        ghul_llvm="$(build/ghul-llvm.sh "$RUNNER_TEMP/ghul-llvm" "${{ needs.version.outputs.ghul_llvm }}")"
        test -x "$ghul_llvm"
        "$ghul_llvm" --version
        dirname "$ghul_llvm" >> "$GITHUB_PATH"

    - name: Build the objects the llvm tests link
      run: build/llvm-test-objects.sh

    - name: Optimise at -O0
      run: |
        ghul_llvm="$(command -v ghul-llvm)"
        printf '#!/bin/sh\nexec "%s" -O0 "$@"\n' "$ghul_llvm" > "$RUNNER_TEMP/ghul-llvm-O0"
        chmod +x "$RUNNER_TEMP/ghul-llvm-O0"
        echo "GHUL_LLVM=$RUNNER_TEMP/ghul-llvm-O0" >> "$GITHUB_ENV"

    - name: Run the llvm integration tests
      run: bash -c "set -o pipefail ; \"$GHUL_TEST\" --config host-llvm integration-tests | tee test-results.txt"

  # The formatter is the AST serializer, so its output has to parse back to
  # the same tree. Nothing else tests that: its unit and analysis-mode tests
  # each check one construct against a snapshot, and a snapshot only says the
  # output is what it was last time, not that it is still ghul. This runs the
  # whole compiler through it and builds what comes out, which is the check
  # the tool exists to pass - and the one that would have caught every defect
  # #2288 lists.
  format_round_trip:
    needs: [version, bootstrap]
    if: needs.version.outputs.build == 'true'
    name: Run formatter round trip

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    # The formatting is done by the compiler this commit produces, and so is
    # the build of what it wrote: a formatter defect and the acceptance of
    # its output are the same commit's responsibility.
    - name: Format the compiler's own source and build it
      env:
        GHUL_COMPILER_DLL: ${{ github.workspace }}/bootstrap-tool/ghul.dll
      run: ./build/format-round-trip.sh

  # Real .ghulproj builds against a separate assembly, so they need the
  # emission surface too.
  cross_assembly_shards:
    needs: [version, bootstrap]
    if: needs.version.outputs.build == 'true'
    name: Cross-assembly shard

    # Each test is a `dotnet build`, so the suite is MSBuild-bound and
    # sharded like the integration tests. `cross_assembly_tests` below is
    # the required status check.
    runs-on: ubuntu-latest

    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    # The `ci-cross-assembly` configuration names the bootstrapped compiler
    # rather than letting each project resolve one. A
    # `dotnet build` picks its compiler from the tool manifest beside the
    # project, so without this the suite tests whatever that manifest
    # happens to hold and says so, reporting `compiler under test: whatever
    # each project resolves for itself`. It is the freshly built compiler
    # here only because an earlier step overwrote that manifest, which is a
    # thin thread to hang the whole point of the job on.
    - name: Run cross-assembly tests
      run: bash -c "set -o pipefail ; dotnet ghul-test --config ci-cross-assembly --shard ${{ matrix.shard }}/3 cross-assembly-tests | tee cross-assembly-test-results.txt"

    # Four tests, so run once rather than split across the shards.
    - name: Run source library tests
      if: matrix.shard == 1
      run: bash -c "set -o pipefail ; dotnet ghul-test --config ci-cross-assembly source-library-tests | tee source-library-test-results.txt"

    - uses: actions/upload-artifact@v7
      with:
        name: cross-assembly-test-results-${{ matrix.shard }}
        path: |
          cross-assembly-test-results.txt
          source-library-test-results.txt

  # The required status check; see the note on `integration_tests`.
  cross_assembly_tests:
    needs: [version, cross_assembly_shards]
    name: Run cross-assembly tests

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - name: Check every shard passed
      env:
        RESULT: ${{ needs.cross_assembly_shards.result }}
        BUILD: ${{ needs.version.outputs.build }}
      run: |
        echo "shards: $RESULT"
        [ "$RESULT" = success ] || { [ "$RESULT" = skipped ] && [ "$BUILD" != true ]; }

  bare_invocation_test:
    needs: [version, bootstrap]
    if: needs.version.outputs.build == 'true'
    name: Run bare invocation test

    runs-on: ubuntu-latest

    timeout-minutes: 5

    # Compile and run a program with no project file and no arguments beyond
    # the source. This is the only path that reaches the compiler's
    # reference-assembly auto-discovery: MSBuild passes the full resolved
    # reference set with `-a`, and the ghul-test harness passes
    # `--sdk-ref-path`, so neither the integration nor the cross-assembly
    # suite can exercise it.
    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Compile and run a program with no project file
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p bare-invocation
        cd bare-invocation
        printf 'entry() is\n    IO.Std.write_line("hello, world");\nsi\n' > hello.ghul
        dotnet ghul-compiler hello.ghul
        actual=$(dotnet hello.exe)
        echo "${actual}"
        test "${actual}" = "hello, world"

    - name: Report usage for --help
      shell: bash
      run: |
        set -euo pipefail
        dotnet ghul-compiler --help > help.txt
        grep -q "usage: ghul-compiler" help.txt

  native_aot_test:
    needs: [version, bootstrap]
    if: needs.version.outputs.build == 'true'
    name: Run Native AOT test

    runs-on: ubuntu-latest

    timeout-minutes: 25

    # Two things, both compiled by the Native AOT compiler rather than run
    # under the JIT: a program, which is the one the compiler's own emitted
    # IL is checked against, and the compiler itself, run over the smoke
    # integration tests. The first is written outside the checkout so that
    # the repository's own Directory.*.props do not apply to it. Each runs
    # under a timeout because the failures seen so far were hangs.
    #
    # Only the smoke subset of the integration tests, because the whole suite
    # under a compiler whose start-up is measured in milliseconds still
    # takes long enough to be worth not doing, and the subset covers every
    # feature tag.
    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Install the freshly-built compiler
      run: dotnet tool install ghul.compiler --tool-path "${RUNNER_TEMP}/ghul-compiler" --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Publish and run a program with Native AOT
      shell: bash
      run: |
        set -euo pipefail
        runtime_version=$(grep -oP 'Include="ghul.runtime" Version="\K[^"]+' Directory.Packages.props)
        project="${RUNNER_TEMP}/native-aot"
        mkdir -p "${project}"
        cat > "${project}/native-aot.ghulproj" <<EOF
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <OutputType>Exe</OutputType>
            <TargetFramework>net10.0</TargetFramework>
            <PublishAot>true</PublishAot>
            <GhulCompiler>${RUNNER_TEMP}/ghul-compiler/ghul-compiler</GhulCompiler>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="ghul.runtime" Version="${runtime_version}" />
            <GhulSources Include="*.ghul" />
          </ItemGroup>
        </Project>
        EOF
        cat > "${project}/program.ghul" <<'EOF'
        use IO.Std.write_line;
        use Collections.LIST;

        narrow(o: object) -> string is
            if let flag: bool = o then
                return "bool {flag}";
            fi

            return "not a bool";
        si

        twice[T](source: Collections.Iterable[T]) -> Collections.Iterable[T] is
            for item in source do
                yield item;
                yield item;
            od
        si

        entry() is
            let yes: object = true;
            let number: object = 42;

            write_line(narrow(yes));
            write_line(narrow(number));
            write_line("isa int?: {isa int?(number)}");

            for value in System.Linq.Enumerable.of_type[object](twice(LIST([1, 2]))) do
                write_line("{cast int(value)}");
            od
        si
        EOF
        dotnet publish "${project}/native-aot.ghulproj" -r linux-x64 -o "${project}/out"
        actual=$(timeout 30 "${project}/out/native-aot")
        echo "${actual}"
        test "${actual}" = "$(printf 'bool true\nnot a bool\nisa int?: true\n1\n1\n2\n2')"

    # The compiler compiled by the bootstrap compiler, so that its emitted IL
    # carries the emission fixes this branch made; built by a published
    # compiler it would carry the IL those fixes replace.
    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Publish the compiler with Native AOT
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p publish
        # ghul-runtime.dll is read as a reference assembly rather than
        # loaded, and wasm.dll is data the wasm target reads, so neither is
        # carried by the publish. Both come from the compiler package the
        # bootstrap job packed.
        for file in ghul-runtime.dll wasm.dll analysis-protocol.runtimeconfig.json; do
          cp "bootstrap-tool/${file}" publish/
        done
        dotnet publish ghul.ghulproj -c Release -r linux-x64 \
          -p:PublishAot=true \
          -p:CI=true \
          -p:Version=${{ needs.version.outputs.package }} \
          "-p:GhulCompiler=dotnet ${GITHUB_WORKSPACE}/bootstrap-tool/ghul.dll" \
          -o publish/

    # Analysis mode reads and writes the protocol by reflection, which a
    # trimmed build can break where the JIT one is fine, and the version it
    # reports is what an editor decides which features to use by. One edit
    # and one hover, checked for both.
    - name: Serve analysis requests under it
      shell: bash
      run: |
        set -euo pipefail
        # The newest reference pack only: a runner can carry more than one,
        # and two copies of an assembly cannot both be loaded.
        reference_pack=$(ls -d "${DOTNET_ROOT}"/packs/Microsoft.NETCore.App.Ref/10.* | sort -V | tail -n 1)
        references=()
        for assembly in "${reference_pack}"/ref/net10.0/*.dll; do
          references+=(-a "${assembly}")
        done
        work="${RUNNER_TEMP}/aot-analysis"
        mkdir -p "${work}"
        cd "${work}"
        printf '%s\n' \
          '{"kind":"set_open_files","paths":["a.ghul"]}' \
          '{"kind":"edit","files":[{"path":"a.ghul","source":"entry() is\n    let x: int = 1\nsi\n"}]}' \
          '{"kind":"hover","path":"a.ghul","line":2,"column":9}' \
          | timeout 60 "${GITHUB_WORKSPACE}/publish/ghul" --analyse "${references[@]}" -a "${GITHUB_WORKSPACE}/publish/ghul-runtime.dll" \
          > responses.json 2> analyser.log || { cat analyser.log; exit 1; }
        cat analyser.log responses.json
        test "$(jq -r 'select(.kind == "listen") | .compiler_version' responses.json)" = "${{ needs.version.outputs.package }}"
        test "$(jq -r 'select(.kind == "hover") | .signature' responses.json)" = "x: int"
        if grep -q '"kind":"error"' responses.json; then exit 1; fi

    # The `published` configuration: the compiler published above, not the
    # ghul-compiler tool, which would test nothing this job published.
    - name: Run the smoke integration tests under it
      shell: bash
      run: dotnet ghul-test --config published --tag smoke integration-tests

    # The archive the installer script and ghul-cli fetch. Renamed to
    # `ghul-compiler`, the command of the .NET tool it stands in for, and
    # packed with the sibling files it needs: the compiler is statically
    # linked and carries its own runtime, so those five files are the whole
    # payload. Built here rather than in a job of its own so that what the
    # smoke tests exercised is what ships, and carried by the release build
    # from the pull request run that produced it.
    - name: Pack the AOT compiler
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p aot/ghul-compiler
        cp publish/ghul aot/ghul-compiler/ghul-compiler
        for file in ghul-runtime.dll wasm.dll analysis-protocol.runtimeconfig.json; do
          cp "publish/${file}" aot/ghul-compiler/
        done
        tar -C aot -czf ghul-compiler-linux-x64.tar.gz ghul-compiler
        sha256sum ghul-compiler-linux-x64.tar.gz > ghul-compiler-linux-x64.tar.gz.sha256

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-aot
        path: |
          ghul-compiler-linux-x64.tar.gz
          ghul-compiler-linux-x64.tar.gz.sha256

  # Builds ghul-runtime against the freshly built compiler, so it needs
  # the emission surface to be complete rather than merely correct.
  runtime_tests:
    needs: [version, bootstrap]
    if: needs.version.outputs.build == 'true'
    name: Run runtime tests

    runs-on: ubuntu-latest

    timeout-minutes: 15

    # Build ghul-runtime (latest main, no version pin) against the
    # bootstrapped compiler and run its unit tests. Same symmetry
    # contract as examples_tests: the new compiler must build current
    # ghul-runtime main, and current ghul-runtime main must build
    # under the previously-published compiler. Catches source-compat
    # regressions in the runtime before they require a runtime fix to
    # unstick - e.g. an inference change that silently breaks the
    # runtime test source.
    steps:
    # Pick `next` over `main` when it exists and is strictly ahead.
    # See docs/claude/breaking-change-coordination.md.
    - name: Resolve ghul-runtime ref
      id: ref
      shell: bash
      env:
        GIT_AUTH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        repo=ghul-lang/ghul-runtime
        # Authenticated, not anonymous: GitHub rate-limits the anonymous git
        # endpoint per IP and a busy runner pool exhausts it, which reads as
        # "could not read Username" and fails the job before any test runs.
        # The job token authenticates reads of public repositories.
        authed="https://x-access-token:${GIT_AUTH_TOKEN}@github.com/${repo}"
        main_sha=$(git ls-remote "${authed}" refs/heads/main | cut -f1)
        next_sha=$(git ls-remote "${authed}" refs/heads/next | cut -f1 || true)
        ref=main
        if [ -n "${next_sha}" ] && [ "${next_sha}" != "${main_sha}" ]; then
          # A partial clone can still be writing into .git as the trap
          # runs, so the remove races and reports "Directory not empty".
          # Under `set -e` that status becomes the step's, failing the job
          # on a scratch directory the runner discards anyway.
          tmp=$(mktemp -d) && trap "rm -rf '${tmp}' || true" EXIT
          git clone --quiet --filter=blob:none --no-checkout --branch=next --depth=200 "${authed}" "${tmp}"
          git -C "${tmp}" fetch --quiet --depth=200 origin main:refs/remotes/origin/main
          if git -C "${tmp}" merge-base --is-ancestor origin/main next; then
            ref=next
            echo "using ${repo}/next"
          fi
        fi
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: ghul-runtime
        ref: ${{ steps.ref.outputs.ref }}

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Install the freshly-built compiler in ghul-runtime
      working-directory: ghul-runtime
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source ../nupkg

    - name: Restore local .NET tools
      working-directory: ghul-runtime
      run: dotnet tool restore

    - name: Build ghul-runtime
      working-directory: ghul-runtime
      run: dotnet build ghul-runtime/ghul-runtime.ghulproj

    - name: Run ghul-runtime unit tests
      working-directory: ghul-runtime
      run: dotnet test tests/tests.ghulproj

  # Builds ghul-examples against the freshly built compiler, so it
  # exercises the emission surface end to end: a consumer repository has
  # to compile against what the bootstrapped compiler produced.
  examples_tests:
    needs: [version, bootstrap]
    if: needs.version.outputs.build == 'true'
    name: Run examples tests

    runs-on: ubuntu-latest

    timeout-minutes: 15

    # Build ghul-examples (latest main, no version pin) against the
    # bootstrapped compiler. ghul-examples has its own CI gating its
    # main, and the language is generally backwards-compatible, so the
    # contract is symmetric: the new compiler must build current
    # ghul-examples main, and current main ghul-examples must build
    # under the previously-published compiler. This job enforces the
    # first half. Runs on both PR and main push: it gates
    # publish_release_package, so a skipped run would silently block
    # publish on the post-merge run.
    steps:
    # Pick `next` over `main` when it exists and is strictly ahead.
    # See docs/claude/breaking-change-coordination.md.
    - name: Resolve ghul-examples ref
      id: ref
      shell: bash
      env:
        GIT_AUTH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        repo=ghul-lang/ghul-examples
        # Authenticated, not anonymous: GitHub rate-limits the anonymous git
        # endpoint per IP and a busy runner pool exhausts it, which reads as
        # "could not read Username" and fails the job before any test runs.
        # The job token authenticates reads of public repositories.
        authed="https://x-access-token:${GIT_AUTH_TOKEN}@github.com/${repo}"
        main_sha=$(git ls-remote "${authed}" refs/heads/main | cut -f1)
        next_sha=$(git ls-remote "${authed}" refs/heads/next | cut -f1 || true)
        ref=main
        if [ -n "${next_sha}" ] && [ "${next_sha}" != "${main_sha}" ]; then
          # A partial clone can still be writing into .git as the trap
          # runs, so the remove races and reports "Directory not empty".
          # Under `set -e` that status becomes the step's, failing the job
          # on a scratch directory the runner discards anyway.
          tmp=$(mktemp -d) && trap "rm -rf '${tmp}' || true" EXIT
          git clone --quiet --filter=blob:none --no-checkout --branch=next --depth=200 "${authed}" "${tmp}"
          git -C "${tmp}" fetch --quiet --depth=200 origin main:refs/remotes/origin/main
          if git -C "${tmp}" merge-base --is-ancestor origin/main next; then
            ref=next
            echo "using ${repo}/next"
          fi
        fi
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Checkout ghul-examples
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-examples
        path: ghul-examples
        ref: ${{ steps.ref.outputs.ref }}

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Install the freshly-built compiler in ghul-examples
      working-directory: ghul-examples
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source ../nupkg

    - name: Restore local .NET tools
      working-directory: ghul-examples
      run: dotnet tool restore

    - name: Build examples
      working-directory: ghul-examples
      run: dotnet build

    - name: Run examples integration tests
      working-directory: ghul-examples
      run: dotnet ghul-test integration-tests

  # Sharded, and gated by `rosetta_tests` below, for the reasons given on
  # the integration shards.
  rosetta_shards:
    needs: [version, llvm_lineage]
    if: needs.version.outputs.build == 'true'
    name: Rosetta Code shard (wasm ${{ matrix.shard }})

    runs-on: ubuntu-latest

    container: buildpack-deps:noble-scm

    timeout-minutes: 15

    # Five shards build the tasks for wasm, as the playground runs them, with
    # the llvm lineage's stage 2 through fork servers, and run them under
    # Node. rosetta_dotnet builds the tasks that cannot run on wasm.
    strategy:
      fail-fast: false
      matrix:
        shard: [1/5, 2/5, 3/5, 4/5, 5/5]

    # Build and run every ghul-rosetta-code task (latest main) against the
    # compiler this run built. The tasks are the largest corpus of top-level
    # code, function literals and inferred locals outside the compiler,
    # and each carries an output-asserting test, so a change to inference
    # or narrowing that alters what a solution does shows up here.
    steps:
    - name: Check the image has no .NET and cannot build C
      run: |
        for tool in dotnet cc gcc clang ld ld.lld as opt llc; do
          if command -v "$tool"; then
            echo "::error::$tool is installed"
            exit 1
          fi
        done

        if [ -e /usr/include/stdio.h ]; then
          echo "::error::the C library's headers are installed"
          exit 1
        fi

    # build/fetch-ghul-test.sh, from this repository.
    - uses: actions/checkout@v7
      with:
        sparse-checkout: build

    # Pick `next` over `main` when it exists and is strictly ahead, as
    # the runtime and examples jobs do, so a compiler change the tasks
    # cannot build under until they are updated can land first.
    - name: Resolve ghul-rosetta-code ref
      id: ref
      shell: bash
      env:
        GIT_AUTH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        repo=ghul-lang/ghul-rosetta-code
        authed="https://x-access-token:${GIT_AUTH_TOKEN}@github.com/${repo}"
        main_sha=$(git ls-remote "${authed}" refs/heads/main | cut -f1)
        next_sha=$(git ls-remote "${authed}" refs/heads/next | cut -f1 || true)
        ref=main
        if [ -n "${next_sha}" ] && [ "${next_sha}" != "${main_sha}" ]; then
          tmp=$(mktemp -d) && trap "rm -rf '${tmp}' || true" EXIT
          git clone --quiet --filter=blob:none --no-checkout --branch=next --depth=200 "${authed}" "${tmp}"
          git -C "${tmp}" fetch --quiet --depth=200 origin main:refs/remotes/origin/main
          if git -C "${tmp}" merge-base --is-ancestor origin/main next; then
            ref=next
            echo "using ${repo}/next"
          fi
        fi
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Checkout ghul-rosetta-code
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-rosetta-code
        path: ghul-rosetta-code
        ref: ${{ steps.ref.outputs.ref }}

    # The harness is the task repository's own: the Native AOT ghul-test of
    # the version its manifest pins. The tasks are checked
    # out at that repository's head, and a task may use a harness feature
    # newer than anything this repository has needed - a `run.session`
    # driving an interactive solution, say - so the harness that matches
    # the corpus is the one pinned alongside it. A pin taken from here
    # instead goes stale silently: the harness ignores the file it does
    # not know about, the solution reads end of input at its first prompt,
    # and the diff blames the compiler under test.
    - name: Fetch the ghul-test runner
      working-directory: ghul-rosetta-code
      run: |
        runner="$("$GITHUB_WORKSPACE/build/fetch-ghul-test.sh" "$PWD/hosts/ghul-test")"
        echo "GHUL_TEST=$runner" >> "$GITHUB_ENV"

    # The runtime the version job chose for the whole run, whose source the
    # wasm builds compile with each task.
    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: ghul-rosetta-code/libraries/ghul-runtime
        ref: ${{ needs.version.outputs.runtime }}

    # The graphical tasks build ghul-raster from source for wasm, at the
    # version the task repository pins.
    - name: Find the ghul-raster version the tasks pin
      id: raster
      working-directory: ghul-rosetta-code
      run: echo "version=$(sed -n 's/.*Include="ghul.raster" Version="\([^"]*\)".*/\1/p' Directory.Packages.props)" >> "$GITHUB_OUTPUT"

    - name: Checkout ghul-raster
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-raster
        path: ghul-rosetta-code/libraries/ghul-raster
        ref: v${{ steps.raster.outputs.version }}

    - name: Download the native compiler
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-llvm-x86_64-unknown-linux-musl

    # The ci-wasm configuration looks for the compiler in hosts/llvm/.
    - name: Install the native compiler
      run: |
        mkdir -p ghul-rosetta-code/hosts/llvm
        tar -xzf ghul-compiler-llvm-x86_64-unknown-linux-musl.tar.gz -O ghul-compiler/ghul-compiler > ghul-rosetta-code/hosts/llvm/ghul
        chmod +x ghul-rosetta-code/hosts/llvm/ghul
        test "$(ghul-rosetta-code/hosts/llvm/ghul)" = "ghūl ${{ needs.version.outputs.package }} llvm"

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Run Rosetta Code integration tests for wasm
      working-directory: ghul-rosetta-code
      run: '"$GHUL_TEST" --config ci-wasm --shard ${{ matrix.shard }} $(scripts/wasm-tasks.sh --fast)'

  # The tasks scripts/wasm-tasks.sh leaves out, which cannot run on wasm,
  # built for .NET with the bootstrapped compiler; and the ones too slow
  # on wasm for the shards above, built for llvm at -O2 with the llvm
  # lineage's stage 2, which runs each in a fraction of the time.
  rosetta_dotnet:
    needs: [version, bootstrap, llvm_lineage]
    if: needs.version.outputs.build == 'true'
    name: Rosetta Code shard (dotnet and llvm)

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
    # Pick `next` over `main` when it exists and is strictly ahead, as
    # the runtime and examples jobs do, so a compiler change the tasks
    # cannot build under until they are updated can land first.
    - name: Resolve ghul-rosetta-code ref
      id: ref
      shell: bash
      env:
        GIT_AUTH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        repo=ghul-lang/ghul-rosetta-code
        authed="https://x-access-token:${GIT_AUTH_TOKEN}@github.com/${repo}"
        main_sha=$(git ls-remote "${authed}" refs/heads/main | cut -f1)
        next_sha=$(git ls-remote "${authed}" refs/heads/next | cut -f1 || true)
        ref=main
        if [ -n "${next_sha}" ] && [ "${next_sha}" != "${main_sha}" ]; then
          tmp=$(mktemp -d) && trap "rm -rf '${tmp}' || true" EXIT
          git clone --quiet --filter=blob:none --no-checkout --branch=next --depth=200 "${authed}" "${tmp}"
          git -C "${tmp}" fetch --quiet --depth=200 origin main:refs/remotes/origin/main
          if git -C "${tmp}" merge-base --is-ancestor origin/main next; then
            ref=next
            echo "using ${repo}/next"
          fi
        fi
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Checkout ghul-rosetta-code
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-rosetta-code
        path: ghul-rosetta-code
        ref: ${{ steps.ref.outputs.ref }}

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Install the freshly-built compiler in ghul-rosetta-code
      working-directory: ghul-rosetta-code
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul.compiler --version ${{ needs.version.outputs.package }} --add-source ../nupkg

    # The harness is the task repository's own, restored below from its
    # manifest, as the runtime and examples jobs do. The tasks are checked
    # out at that repository's head, and a task may use a harness feature
    # newer than anything this repository has needed - a `run.session`
    # driving an interactive solution, say - so the harness that matches
    # the corpus is the one pinned alongside it. A pin taken from here
    # instead goes stale silently: the harness ignores the file it does
    # not know about, the solution reads end of input at its first prompt,
    # and the diff blames the compiler under test.
    - name: Restore local .NET tools
      working-directory: ghul-rosetta-code
      run: dotnet tool restore

    # The task repository's default configuration builds a task with the
    # compiler alone when it references nothing but ghul.runtime, which has to
    # be in the package cache before the run decides; restoring any one task
    # puts it there.
    - name: Restore the runtime the tasks reference
      working-directory: ghul-rosetta-code
      run: dotnet restore "$(ls tasks/*/*.ghulproj | head -n 1)"

    # --compiler names the bootstrapped compiler in place of each task's own,
    # for the reason given on the cross-assembly tests.
    - name: Run Rosetta Code integration tests for .NET
      working-directory: ghul-rosetta-code
      run: dotnet ghul-test --compiler "dotnet ${GITHUB_WORKSPACE}/bootstrap-tool/ghul.dll" $(scripts/wasm-tasks.sh --others)

    - name: Checkout ghul-runtime
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-runtime
        path: ghul-rosetta-code/libraries/ghul-runtime
        ref: ${{ needs.version.outputs.runtime }}

    - name: Find the ghul-raster version the tasks pin
      id: raster
      working-directory: ghul-rosetta-code
      run: echo "version=$(sed -n 's/.*Include="ghul.raster" Version="\([^"]*\)".*/\1/p' Directory.Packages.props)" >> "$GITHUB_OUTPUT"

    - name: Checkout ghul-raster
      uses: actions/checkout@v7
      with:
        repository: ghul-lang/ghul-raster
        path: ghul-rosetta-code/libraries/ghul-raster
        ref: v${{ steps.raster.outputs.version }}

    - name: Download the native compiler
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-llvm-x86_64-unknown-linux-musl

    # The ci-llvm configuration looks for the compiler in hosts/llvm/.
    - name: Install the native compiler
      run: |
        mkdir -p ghul-rosetta-code/hosts/llvm
        tar -xzf ghul-compiler-llvm-x86_64-unknown-linux-musl.tar.gz -O ghul-compiler/ghul-compiler > ghul-rosetta-code/hosts/llvm/ghul
        chmod +x ghul-rosetta-code/hosts/llvm/ghul
        test "$(ghul-rosetta-code/hosts/llvm/ghul)" = "ghūl ${{ needs.version.outputs.package }} llvm"

    # For build/ghul-llvm.sh.
    - name: Checkout the compiler's build scripts
      uses: actions/checkout@v7
      with:
        path: ghul
        sparse-checkout: build

    - name: Fetch ghul-llvm
      run: |
        ghul_llvm="$(ghul/build/ghul-llvm.sh "$RUNNER_TEMP/ghul-llvm" "${{ needs.version.outputs.ghul_llvm }}")"
        test -x "$ghul_llvm"
        dirname "$ghul_llvm" >> "$GITHUB_PATH"

    - name: Run the Rosetta Code tasks too slow on wasm for llvm
      working-directory: ghul-rosetta-code
      run: dotnet ghul-test --config ci-llvm $(scripts/wasm-tasks.sh --slow)


  # The required status check; see the note on `integration_tests`.
  rosetta_tests:
    needs: [version, rosetta_shards, rosetta_dotnet]
    name: Run Rosetta Code tests

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - name: Check every shard passed
      env:
        WASM: ${{ needs.rosetta_shards.result }}
        DOTNET: ${{ needs.rosetta_dotnet.result }}
        BUILD: ${{ needs.version.outputs.build }}
      run: |
        echo "wasm shards: $WASM, dotnet: $DOTNET"
        for result in "$WASM" "$DOTNET"; do
          [ "$result" = success ] || { [ "$result" = skipped ] && [ "$BUILD" != true ]; } || exit 1
        done

  # The one verdict the publish jobs wait on. On a pull request, and on a
  # release build that runs the suite itself, every test job ran and must
  # have passed; on a release build carrying the pull request's packages
  # nothing ran at all, and `version` having carried them is the verdict.
  # A `needs` list cannot say that: a
  # skipped job in it skips the dependent too unless the dependent runs `always()`, and
  # then a skipped job satisfies it. This job runs regardless and checks
  # that nothing was skipped that should have run.
  gate:
    needs: [version, bootstrap, unit_tests, analysis_tests, llvm_lineage, llvm_fixed_point, llvm_lineage_tests, llvm_cross_check, wasm_bootstrap, integration_tests, wasm_validation, llvm_tests, cross_assembly_tests, bare_invocation_test, native_aot_test, runtime_tests, examples_tests, format_round_trip, rosetta_tests]
    name: Gate

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - name: Check every required job passed
      env:
        BUILD: ${{ needs.version.outputs.build }}
        RESULTS: ${{ toJSON(needs) }}
      run: |
        set -euo pipefail
        echo "build: ${BUILD}"
        ok=true
        jobs=$(echo "${RESULTS}" | jq -r 'keys[]')
        [ -n "${jobs}" ]
        for job in ${jobs}; do
          result=$(echo "${RESULTS}" | jq -r --arg j "${job}" '.[$j].result')
          echo "${job}: ${result}"
          case "${job}:${result}" in
            *:success) continue ;;
            *:skipped)
              [ "${BUILD}" != true ] && continue ;;
          esac
          echo "::error::${job}: ${result}"
          ok=false
        done
        [ "${ok}" = true ]

  # These condition on the gate explicitly rather than through `needs`
  # alone: a job's default condition is false when any job upstream of it
  # was skipped, however far upstream, and a release run that carries the
  # pull request's packages skips every build and test job. `!cancelled()` opts out of
  # that rule and the gate's own result is what stands in for it.
  publish_release_package:
    needs: [version, gate, create_release]
    name: Publish release package

    timeout-minutes: 5

    runs-on: ubuntu-latest

    # Declared rather than inherited: this repository's default workflow token
    # is read-only, and pushing to the GitHub feed needs packages:write.
    # id-token lets the job ask GitHub for the short-lived token nuget.org
    # trades for a publishing key; nothing here holds a NuGet secret.
    permissions:
      contents: read
      packages: write
      id-token: write

    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.create_release.result == 'success' && github.event_name == 'push' }}

    steps:
    - uses: actions/checkout@v7

    - name: Download ghul compiler tool package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download analysis protocol package
      uses: actions/download-artifact@v8
      with:
        name: ghul-analysis-protocol-package
        path: nupkg

    - name: Publish release package to GitHub
      run: dotnet nuget push ./nupkg/ghul.compiler.${{ needs.version.outputs.package }}.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/ghul-lang/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Each key nuget.org hands back is single use and lasts an hour, so every
    # push to nuget.org has its own exchange immediately before it.
    - name: Ask nuget.org for a publishing key for the compiler
      id: login_compiler
      uses: NuGet/login@v1
      with:
        # The nuget.org profile name, which is not an email address.
        user: ${{ secrets.NUGET_USER }}

    - name: Publish release package to NuGet
      run: dotnet nuget push ./nupkg/ghul.compiler.${{ needs.version.outputs.package }}.nupkg --api-key ${{ steps.login_compiler.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols

    - name: Publish analysis protocol release package to GitHub
      run: dotnet nuget push ./nupkg/ghul.analysis.protocol.${{ needs.version.outputs.package }}.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/ghul-lang/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Ask nuget.org for a publishing key for the analysis protocol
      id: login_protocol
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish analysis protocol release package to NuGet
      run: dotnet nuget push ./nupkg/ghul.analysis.protocol.${{ needs.version.outputs.package }}.nupkg --api-key ${{ steps.login_protocol.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols

  # Before the packages are published: the llvm lineage starts from the
  # native compiler released with the .NET compiler NuGet serves, so a
  # version reaches NuGet only once its release carries its native
  # compilers.
  create_release:
    needs: [version, gate]
    name: Create release
    runs-on: ubuntu-latest

    timeout-minutes: 5
    if: ${{ !cancelled() && needs.gate.result == 'success' && github.event_name == 'push' }}

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Download ghul.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download the AOT compiler archive
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-aot
        path: aot

    - name: Download the x64 native compiler
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-llvm-x86_64-unknown-linux-musl
        path: llvm

    - name: Download the arm64 native compiler
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-llvm-aarch64-unknown-linux-musl
        path: llvm-arm64

    - name: Download the wasm-built compiler archive
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-wasm
        path: wasm

    # A push to main is normally one squashed pull request; the range covers
    # a direct push of several commits too, and the notes list each.
    - name: Create changelog
      run: |
        range="${{ github.event.before }}..${{ github.sha }}"
        git rev-parse -q --verify "${{ github.event.before }}^{commit}" >/dev/null || range="-1"
        git log --format="%s%n%n%b%n%n" ${range} >changelog.txt

    - name: Create a release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        build/release-assets.sh "${{ needs.version.outputs.package }}" > assets.txt
        mapfile -t assets < assets.txt
        printf 'attaching %s\n' "${assets[@]}"
        gh release create "${{ needs.version.outputs.tag }}" \
          "${assets[@]}" \
          --title "${{ needs.version.outputs.tag }}" \
          --notes-file changelog.txt
